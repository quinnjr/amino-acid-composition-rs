[package]
name = "amino-acid-composition-rs"
version = "1.0.0"
edition = "2021"
authors = ["Joseph Quinn <quinn.josephr@protonmail.com>"]
description = "Rust implementation of the AminoAcidComposition plugin for PluMA - Protein sequence analysis"
license = "MIT"
repository = "https://github.com/quinnjr/amino-acid-composition-rs"
keywords = ["bioinformatics", "protein", "amino-acid", "fasta", "pluma"]
categories = ["science", "algorithms"]

[lib]
name = "amino_acid_composition_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "amino-acid-composition"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
pluma-plugin-trait = "1.1.0"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.8.0"

[[bench]]
name = "composition_bench"
harness = false
